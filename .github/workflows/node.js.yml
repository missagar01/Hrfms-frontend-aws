name: Deploy Frontend (EC2 Self-Hosted)

on:
  push:
    branches: ["main"]

concurrency:
  group: frontend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Build
        run: |
          npm run build

      # Vite => dist
      - name: Deploy dist to Nginx web root
        run: |
          sudo mkdir -p /var/www/hrfms-frontend
          sudo rm -rf /var/www/hrfms-frontend/*
          sudo cp -r dist/* /var/www/hrfms-frontend/
          sudo nginx -t
          sudo systemctl reload nginx
