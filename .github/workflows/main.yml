name: Deploy Frontend to S3

on:
  push:
    branches:
      - main

concurrency:
  group: frontend-s3-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 🔐 Create .env for Vite build
      - name: Create .env file
        run: |
          echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" > .env
          echo "VITE_API_BASE_URL is set."

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build frontend (Vite)
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          # Sync everything except index.html with long cache
          aws s3 sync dist s3://${{ secrets.S3_BUCKET }} --delete --exclude "index.html" --cache-control "public, max-age=31536000, immutable"
          
          # Upload index.html with no-cache to ensure users get the latest version immediately
          aws s3 cp dist/index.html s3://${{ secrets.S3_BUCKET }}/index.html --cache-control "no-cache, no-store, must-revalidate"
